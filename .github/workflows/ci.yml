name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install tools and dependencies
        run: |
          mise install
          mise exec -- npm ci

      - name: Build
        run: mise exec -- npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
