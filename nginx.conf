# Static site for bryanwp.com (TLS + HSTS are usually configured on your ingress / CDN).
# Local Docker: server_name includes localhost.

# Apex hostname — redirect www to https://bryanwp.com (HTTPS assumed at load balancer).
server {
	listen 80;
	server_name www.bryanwp.com;
	return 301 https://bryanwp.com$request_uri;
}

server {
	listen 80;
	server_name bryanwp.com localhost;

	root /usr/share/nginx/html;
	index index.html;

	charset utf-8;

	gzip on;
	gzip_vary on;
	gzip_min_length 256;
	gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# Astro fingerprinted assets
	location /_astro/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# Match Astro output: /go/<slug>/index.html — also handles /go/<slug> without trailing slash
	location / {
		try_files $uri $uri/index.html $uri/ =404;
	}

	error_page 404 /404.html;
}
